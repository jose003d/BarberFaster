<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Login y Registro | Barber Faster</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/loginform.css">
</head>

<body>
  <div class="split-container">

    <!-- Aquí los 2 formularios. Debo añadir una mejor animación a futuro -->
    <div class="left-column">
      <main class="form-container">
        <section id="loginForm" class="form-section active">
          <h2>Iniciar sesión</h2>
          <form action="" method="">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Ingresar</button>
            <button type="reset" class="cancelbtn">Cancelar</button>
            <div class="psw">¿Olvidaste tu <a href="index.html">contraseña?</a></div>
          </form>
          <button class="toggle-btn" onclick="mostrarRegistro()">¿No tienes cuenta? Regístrate</button>
        </section>

        <section id="registroForm" class="form-section">
          <h2>Registrarse</h2>
          <form action="" method="">
            <label for="fullname">Nombre completo</label>
            <input type="text" id="fullname" name="fullname" required>

            <label for="email">Correo electrónico</label>
            <input type="email" id="email" name="email" required>

            <label for="newuser">Nombre de usuario</label>
            <input type="text" id="newuser" name="newuser" required>

            <label for="newpass">Contraseña</label>
            <input type="password" id="newpass" name="newpass" required>

            <button type="submit">Registrarse</button>
            <button type="reset" class="cancelbtn">Cancelar</button>
          </form>
          <button class="toggle-btn" onclick="mostrarLogin()">¿Ya tienes cuenta? Inicia sesión</button>
        </section>
      </main>
    </div>

    <!-- Aquí el texto con foto. Debo de expandir el texto -->
    <aside class="welcome-container">
      <img src="img/bflogo.png" alt="Logo Barber Faster" class="logo">
      <h1>Bienvenido a Barber Faster</h1>
      <p>Tu barbería digital donde puedes agendar citas, ver servicios y conectarte con los mejores barberos de la
        ciudad.</p>
    </aside>
  </div>

  <script>
    function mostrarRegistro() {
      document.getElementById('loginForm').classList.remove('active');
      document.getElementById('registroForm').classList.add('active');
      setTimeout(() => {
        document.getElementById('fullname').focus();
      }, 100);
    }

    function mostrarLogin() {
      document.getElementById('registroForm').classList.remove('active');
      document.getElementById('loginForm').classList.add('active');
      setTimeout(() => {
        document.getElementById('username').focus();
      }, 100);
    }

    window.onload = () => {
      document.getElementById('username').focus();
    };
  </script>
</body>

</html>
